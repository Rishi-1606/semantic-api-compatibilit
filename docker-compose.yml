version: "3.9"

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: semantic-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semantic_api_db}
      POSTGRES_USER: ${POSTGRES_USER:-semantic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-semantic_user} -d ${POSTGRES_DB:-semantic_api_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Spring Boot Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semantic-api-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-semantic_api_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-semantic_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # Node.js API Gateway
  # ─────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: semantic-api-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3001
      BACKEND_URL: http://backend:8080
      NODE_ENV: production
      MOCK_API_V1_URL: http://mock-api-v1:8081
      MOCK_API_V2_URL: http://mock-api-v2:8082
      RULE_CACHE_TTL_MS: 60000
      TARGET_TIMEOUT_MS: 10000
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # React Frontend (served via Nginx in Docker)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8080
        VITE_GATEWAY_URL: http://localhost:3001
    container_name: semantic-api-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - gateway
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # Mock Customer API V1  (legacy schema)
  # ─────────────────────────────────────────
  mock-api-v1:
    build:
      context: ./mock-apis/api-v1
      dockerfile: Dockerfile
    container_name: semantic-api-mock-v1
    restart: unless-stopped
    environment:
      PORT: 8081
      NODE_ENV: production
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────
  # Mock Customer API V2  (updated schema)
  # ─────────────────────────────────────────
  mock-api-v2:
    build:
      context: ./mock-apis/api-v2
      dockerfile: Dockerfile
    container_name: semantic-api-mock-v2
    restart: unless-stopped
    environment:
      PORT: 8082
      NODE_ENV: production
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: semantic-api-postgres-data
