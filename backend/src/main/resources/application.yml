# =====================================================
# application.yml — Default (local dev with H2)
# =====================================================

spring:
  application:
    name: semantic-api-backend

  # ── Default profile uses H2 in-memory DB ──
  datasource:
    url: jdbc:h2:mem:semantic_api_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none          # Flyway handles schema
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ──
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Application info ──
info:
  app:
    name: Semantic API Compatibility Backend
    version: 1.0.0
    phase: "Phase 1 - Foundation"

# ── CORS (allow React dev server) ──
app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  confidence:
    auto-approve-threshold: 0.90
    human-approval-threshold: 0.70

# ── NLP Pipeline (Phase 5) ────────────────────────────────────
# Generic, domain-agnostic abbreviation expansions.
# Keys: lowercase token as it appears after tokenization.
# Values: the full expanded form (also lowercase).
# Add new entries here without touching Java code.
nlp:
  abbreviations:
    # ── Quantity / number ──
    # NOTE: 'no' must be quoted — YAML 1.1 treats bare 'no' as boolean false
    "no": number
    num: number
    qty: quantity
    amt: amount
    cnt: count
    # ── Contact / communication ──
    mob: mobile
    ph: phone
    tel: telephone
    fax: facsimile
    ext: extension
    # ── Address / location ──
    addr: address
    str: street
    ave: avenue
    blvd: boulevard
    apt: apartment
    zip: zipcode
    # ── Entity identifiers ──
    id: identifier
    cust: customer
    prod: product
    ord: order
    dept: department
    org: organization
    # ── Person / name ──
    fn: firstname
    ln: lastname
    mi: middleinitial
    dob: dateofbirth
    # ── Finance ──
    bal: balance
    txn: transaction
    acct: account
    cur: currency
    # ── Date / time ──
    dt: date
    ts: timestamp
    yr: year
    mo: month
    hr: hour
    mins: minute
    sec: second
    # ── Common abbreviations ──
    desc: description
    ref: reference
    seq: sequence
    idx: index
    cfg: configuration
    img: image
    msg: message
    err: error
    req: request
    resp: response
    auth: authentication
    usr: user
    pwd: password
    lang: language
    loc: location
    lat: latitude
    lng: longitude
    max: maximum
    min: minimum
    avg: average
    std: standard
