# =====================================================
# application.yml — Default (local dev with H2)
# =====================================================

spring:
  application:
    name: semantic-api-backend

  # ── Default profile uses H2 in-memory DB ──
  datasource:
    url: jdbc:h2:mem:semantic_api_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none          # Flyway handles schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ──
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Application info ──
info:
  app:
    name: Semantic API Compatibility Backend
    version: 1.0.0
    phase: "Phase 1 - Foundation"

# ── CORS (allow React dev server) ──
app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  confidence:
    auto-approve-threshold: 0.90
    human-approval-threshold: 0.70
