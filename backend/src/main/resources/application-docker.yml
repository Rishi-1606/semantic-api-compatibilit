# =====================================================
# application-docker.yml — Docker / PostgreSQL profile
# =====================================================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/semantic_api_db}
    username: ${DATABASE_USERNAME:semantic_user}
    password: ${DATABASE_PASSWORD:changeme_strong_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
