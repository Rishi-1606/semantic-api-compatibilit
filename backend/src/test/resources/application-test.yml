spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Minimal abbreviation set for integration tests
nlp:
  abbreviations:
    mob: mobile
    ph: phone
    "no": number
    num: number
    addr: address
    cust: customer
    id: identifier
    dt: date
    qty: quantity
    str: street

# Phase 6: use lexical-fallback in tests (no Ollama required)
ai:
  embedding:
    provider: lexical-fallback
    fallback-on-error: true
    auto-approve-threshold: 0.90
    review-threshold: 0.70
